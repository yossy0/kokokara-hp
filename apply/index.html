<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="referrer" content="no-referrer" />
  <meta name="format-detection" content="telephone=no" />
  <title>イベント申込｜学生団体ココカラ</title>
  <link rel="icon" href="../assets/icon-r.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,600;0,800;0,900;1,900&family=Noto+Sans+JP:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet" />
  <meta name="theme-color" content="#FBFCFD" />
  <link rel="stylesheet" href="../style.css" />
</head>
<body class="apply-page">
  <header class="site-header scrolled">
    <div class="container header-inner">
      <a class="brand" href="../index.html">
        <img src="../assets/logo-lockup.png" alt="学生団体ココカラ ロゴ" />
        <span class="brand-name">学生団体ココカラ</span>
      </a>
    </div>
  </header>
  <main class="apply-main" data-liff-apply>
    <section class="page-hero apply-hero">
      <div class="container apply-container">
        <span class="eyebrow">Event Entry</span>
        <h1>イベント申込</h1>
        <p>公式LINEから申し込むための専用ページです。</p>
      </div>
    </section>
    <section class="apply-body">
      <div class="container apply-container">
        <div class="apply-status" data-apply-status aria-live="polite"><p class="apply-message">読み込み中…</p></div>
        <div class="apply-events" data-apply-events hidden></div>
        <form class="apply-form" data-apply-form novalidate hidden></form>
        <div class="apply-result" data-apply-result aria-live="polite" hidden></div>
        <noscript><p class="apply-message">このページを使うには JavaScript を有効にしてください。</p></noscript>
      </div>
    </section>
  </main>
  <footer class="apply-footer">
    <div class="container apply-container">&copy; <span data-year>2026</span> KOKOKARA.　<a href="../privacy.html">プライバシーポリシー</a></div>
  </footer>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="../site.js"></script>
</body>
</html>
